<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- One icon for every size. Element sizes and the gaps between them are kept
       coarse on purpose so the 16px and 32px renders stay legible; anything
       finer turns to grey mush at 16px. -->
  <rect width="128" height="128" rx="26" fill="#0f1419"/>
  <!-- sheet feeding in, behind the printer body -->
  <rect x="38" y="20" width="52" height="30" rx="3" fill="#ffffff" opacity="0.6"/>
  <!-- printer body -->
  <rect x="16" y="46" width="96" height="40" rx="8" fill="#ffffff"/>
  <!-- printed sheet coming out the front, with the X on it -->
  <rect x="33" y="64" width="62" height="46" rx="5" fill="#ffffff" stroke="#0f1419" stroke-width="7"/>
  <g transform="translate(47 71) scale(0.0285)">
    <path fill="#0f1419" stroke="#0f1419" stroke-width="45" stroke-linejoin="round" d="M714.163 519.284L1160.89 0H1055.03L667.137 450.887L357.328 0H0L468.492 681.821L0 1226.37H105.866L515.491 750.218L842.672 1226.37H1200L714.137 519.284H714.163ZM569.165 687.828L521.697 619.934L144.011 79.6944H306.615L611.412 515.685L658.88 583.579L1055.08 1150.3H892.476L569.165 687.854V687.828Z"/>
  </g>
</svg>
